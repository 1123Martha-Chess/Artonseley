<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artonseley — Consulta ágil de leyes y artículos de México</title>
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/png" href="imagenes/artonseley-favicon.png">
    <link rel="canonical" href="https://www.artonseley.site/">

    <!-- "Snippet": cómo se ve el sitio en resultados de búsqueda y al
         compartir el link (WhatsApp, Facebook, etc.). Va aquí y no en
         index.html porque index.html exige sesión iniciada — quien no
         tiene cuenta (y cualquier buscador/crawler) siempre termina
         viendo esta página. -->
    <meta name="description" content="Simplifica tu consulta legal. Encuentra artículos y legislaciones de México de forma rápida, accesible y fácil mediante palabras clave. Resultados rápidos y accesibles.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Artonseley">
    <meta property="og:title" content="Artonseley | Busqueda Ágil de Leyes en México">
    <meta property="og:description" content="Simplifica tu consulta legal. Encuentra artículos y legislaciones de México de forma rápida, accesible y fácil mediante palabras clave. Resultados rápidos y accesibles.">
    <meta property="og:url" content="https://www.artonseley.site">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Artonseley | Busqueda Ágil de Leyes en México">
    <meta name="twitter:description" content="Simplifica tu consulta legal. Encuentra artículos y legislaciones de México de forma rápida, accesible y fácil mediante palabras clave. Resultados rápidos y accesibles.">
    <script src="Sistema/temaGuardado.js"></script>
    <link rel="stylesheet" href="tema.css">
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--texto);
            background: var(--fondo);
            padding: 20px;
        }

        .tarjeta-login {
            width: 100%;
            max-width: 380px;
            background: var(--superficie);
            border: 1px solid var(--borde);
            border-radius: 10px;
            box-shadow: 0 2px 10px var(--sombra-2);
            padding: 32px 28px;
        }

        .tarjeta-login h1 {
            font-size: 20px;
            margin: 0 0 6px 0;
            text-align: center;
        }

        .tarjeta-login p.subtitulo {
            margin: 0 0 24px 0;
            text-align: center;
            font-size: 13px;
            color: var(--texto-2);
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            color: var(--texto);
            background: var(--superficie);
            border: 1px solid var(--borde-2);
            border-radius: 6px;
            margin-bottom: 16px;
        }

        button {
            width: 100%;
            padding: 11px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: var(--color-primario);
            border: 1px solid var(--color-primario);
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(0.9);
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #mensajeLogin {
            min-height: 18px;
            margin-top: 14px;
            font-size: 13px;
            text-align: center;
        }

        #mensajeLogin.error {
            color: #d9534f;
        }
    </style>
</head>
<body>
    <div class="tarjeta-login">
        <h1>Iniciar sesión</h1>
        <p class="subtitulo">Acceso solo para usuarios con licencia activa.</p>

        <form id="formularioLogin">
            <label for="campoEmail">Correo</label>
            <input type="email" id="campoEmail" autocomplete="email" required>

            <label for="campoContrasena">Contraseña</label>
            <input type="password" id="campoContrasena" autocomplete="current-password" required>

            <button type="submit" id="botonEntrar">Entrar</button>
        </form>

        <p id="mensajeLogin"></p>
    </div>

    <script type="module" src="Sistema/manejaLogin.js"></script>
</body>
</html>
