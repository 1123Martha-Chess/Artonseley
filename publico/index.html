<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artonseley</title>
    <link rel="icon" type="image/png" href="imagenes/artonseley-favicon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="plataforma.css">
</head>
<body>
    <!-- =========================================================
         PANTALLA DE INICIO: saludo aleatorio (Georgia, negro) + las
         "burbujas" de acceso a cada parte del sistema. Cada burbuja es
         un enlace a su propia página.

         El Escritorio y Pestañas van aparte, como botones PRINCIPALES:
         dos cuadros grandes y centrados, del mismo tamaño, con medidas
         fijas en píxeles (ver .burbuja-principal en plataforma.css).
         Escritorio = ventanas en mosaico; Pestañas = un navegador interno
         con pestañas tipo Chrome/Edge. Las demás quedan debajo, en su
         rejilla.
         ========================================================= -->
    <main class="inicio">
        <div class="inicio-marca">
            <img id="iconoMarca" class="logo-icono" src="imagenes/artonseley-pagina.png" alt="Ícono ARTONSELEY">
            <img id="letrasMarca" class="logo-letras" src="imagenes/artonseley-letras.png" alt="ARTONSELEY">
        </div>

        <!-- inicioPrincipal.js reemplaza este texto por una frase al azar
             (ver Sistema/frasesBienvenida.js) con el apodo del usuario. -->
        <h1 id="saludo" class="saludo">Bienvenido/a</h1>

        <div class="acceso-principal">
            <a class="burbuja burbuja-principal" href="escritorio.html">
                <span class="burbuja-icono">🧩</span> Escritorio
            </a>
            <a class="burbuja burbuja-principal" href="pestanas.html">
                <span class="burbuja-icono">🗂️</span> Pestañas
            </a>
        </div>

        <nav class="rejilla-accesos">
            <a class="burbuja" href="buscador.html">
                <span class="burbuja-icono">🔍</span> Buscador
            </a>
            <a class="burbuja" href="editor.html">
                <span class="burbuja-icono">📓</span> Cuadernos
            </a>
            <a class="burbuja" href="notificaciones.html">
                <span class="burbuja-icono">🔔</span> Notificaciones
            </a>
            <a class="burbuja" href="sugerencias.html">
                <span class="burbuja-icono">💡</span> Sugerencias
            </a>
            <a class="burbuja" href="configuracion.html">
                <span class="burbuja-icono">⚙️</span> Configuración
            </a>
            <a class="burbuja" href="calendario.html">
                <span class="burbuja-icono">📅</span> Calendario
            </a>
            <a class="burbuja" href="musica.html">
                <span class="burbuja-icono">🎵</span> Música
            </a>
            <a class="burbuja" href="calculadora.html">
                <span class="burbuja-icono">🧮</span> Calculadora
            </a>
            <a class="burbuja" href="plantillas.html">
                <span class="burbuja-icono">📝</span> Plantillas
            </a>
        </nav>
    </main>

    <script type="module" src="Sistema/reproductorGlobal.js"></script>
    <script type="module" src="Sistema/inicioPrincipal.js"></script>
</body>
</html>
