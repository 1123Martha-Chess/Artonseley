<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Artonseley">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="imagenes/artonseley-favicon.png">
    <title>Noticias Jurídicas - Artonseley</title>
    <link rel="icon" type="image/png" href="imagenes/artonseley-favicon.png">
    <script src="Sistema/temaGuardado.js"></script>
    <link rel="stylesheet" href="tema.css">
    <link rel="stylesheet" href="plataforma.css">
    <style>
        .ntj-noticia h3 { margin: 0 0 4px 0; }

        .ntj-fecha {
            display: inline-block;
            font-family: Arial, sans-serif;
            font-size: 12.5px;
            color: var(--texto-2);
            margin-bottom: 12px;
        }

        /* Cada foto ocupa TODO el ancho del cuadro de la noticia (una
           debajo de otra si hay varias), en vez de una cuadrícula de
           miniaturas — se ve su proporción real, sin recortarla. */
        .ntj-imagenes {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }

        .ntj-imagenes a {
            display: block;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--borde);
        }

        .ntj-imagenes img {
            display: block;
            width: 100%;
            height: auto;
        }

        .ntj-cuerpo {
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: var(--texto);
            white-space: pre-wrap;
            margin: 0 0 14px 0;
        }

        /* Enlaces detectados dentro del cuerpo de la noticia: se pintan de
           azul (el color clásico de "esto es un enlace"), a propósito
           INDEPENDIENTE del color de acento elegido en Personalización, y
           mostrando la URL tal cual la escribió el administrador — así
           quien lee sabe exactamente a dónde lo llevará antes de tocarlo,
           en vez de confiar a ciegas en un botón genérico. */
        .ntj-enlace-cuerpo {
            color: #1a56db;
            text-decoration: underline;
            word-break: break-all;
        }

        :root[data-tema="oscuro"] .ntj-enlace-cuerpo {
            color: #6ea8fe;
        }

        .ntj-vacio { color: var(--texto-2); font-size: 14px; font-family: Arial, sans-serif; }
    </style>
</head>
<body>
    <div class="pantalla">
        <a href="index.html" class="volver">← Volver al inicio</a>
        <h1>Noticias Jurídicas</h1>
        <p class="pantalla-descripcion">
            ¿Qué pasó en el DOF la semana pasada? Aquí encontrarás un resumen de las novedades
            legales más relevantes, organizado en cuadros.
        </p>

        <div id="listaNoticias">
            <p class="mensaje-carga">Cargando…</p>
        </div>
    </div>

    <script type="module" src="Sistema/reproductorGlobal.js"></script>
    <script type="module" src="Sistema/noticiasJuridicasPrincipal.js"></script>
</body>
</html>
