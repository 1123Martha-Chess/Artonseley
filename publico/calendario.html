<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Artonseley">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="imagenes/artonseley-favicon.png">
    <title>Calendario - Artonseley</title>
    <link rel="icon" type="image/png" href="imagenes/artonseley-favicon.png">
    <script src="Sistema/temaGuardado.js"></script>
    <link rel="stylesheet" href="tema.css">
    <link rel="stylesheet" href="plataforma.css">
    <style>
        [hidden] { display: none !important; }

        html, body { height: 100%; }
        body {
            font-family: Arial, sans-serif;
            color: var(--texto);
            background: var(--fondo);
            margin: 0;
            display: flex;
            flex-direction: column;
            /* Notch a los lados en la app instalada (iOS); arriba se
               resuelve en .cal-barra. */
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* ================= Barra superior ================= */
        .cal-barra {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: calc(8px + env(safe-area-inset-top)) 14px 8px 14px;
            background: var(--superficie);
            border-bottom: 1px solid var(--borde);
        }
        .cal-barra .marca-mini { display: flex; align-items: center; gap: 7px; text-decoration: none; }
        .cal-barra .marca-mini img.icono { height: 22px; }
        .cal-barra .marca-mini img.letras { height: 12px; }
        .cal-barra .enlace-inicio { margin-left: auto; font-size: 13px; color: var(--color-primario); text-decoration: none; }
        .cal-barra .enlace-inicio:hover { text-decoration: underline; }

        /* ================= Encabezado del mes ================= */
        #calendario {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        .cal-encabezado {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .cal-nav {
            width: 40px;
            height: 34px;
            font-size: 15px;
            font-weight: bold;
            color: var(--texto);
            border: 1px solid var(--borde-2);
            background: var(--superficie);
            border-radius: 8px;
            cursor: pointer;
        }
        .cal-nav:hover { background: var(--color-primario-suave); }

        .cal-titulo {
            font-size: 20px;
            font-weight: bold;
            min-width: 210px;
            text-align: center;
        }

        .cal-hoy {
            margin-left: 8px;
            padding: 8px 14px;
            font-size: 13px;
            border: 1px solid var(--color-primario);
            color: var(--color-primario);
            background: var(--superficie);
            border-radius: 8px;
            cursor: pointer;
        }
        .cal-hoy:hover { background: var(--color-primario-suave); }

        /* ================= Rejilla del mes ================= */
        .cal-dias-semana {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 4px;
        }
        .cal-dias-semana div {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: var(--texto-2);
            padding: 4px 0;
        }

        .cal-rejilla {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: 1fr;
            gap: 4px;
        }

        .cal-celda {
            background: var(--superficie);
            border: 1px solid var(--borde);
            border-radius: 8px;
            padding: 4px 6px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-height: 0;
        }
        .cal-celda:hover { border-color: var(--color-primario); }
        .cal-celda-vacia { background: transparent; border: none; cursor: default; }
        .cal-celda-hoy { outline: 2px solid var(--color-primario); outline-offset: -2px; }

        .cal-numero { font-size: 13px; font-weight: bold; color: var(--texto); }

        .cal-notas-celda { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .cal-chip-nota {
            font-size: 11px;
            background: var(--color-primario-suave);
            color: var(--color-primario);
            border-radius: 4px;
            padding: 1px 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cal-chip-mas { font-size: 10px; color: var(--texto-2); padding-left: 3px; }

        /* ================= Panel de un día ================= */
        .cal-panel-fondo {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 90;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: max(30px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(30px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            overflow-y: auto;
        }

        .cal-panel-dia {
            position: relative;
            background: var(--superficie);
            border-radius: 14px;
            box-shadow: 0 10px 30px var(--sombra-2);
            padding: 22px 24px;
            max-width: 460px;
            width: 100%;
        }

        .cal-panel-dia h2 { font-size: 17px; margin: 0 32px 14px 0; }

        .cal-panel-cerrar {
            position: absolute;
            top: 14px; right: 14px;
            width: 28px; height: 28px;
            border: none;
            background: var(--superficie-2);
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
        }
        .cal-panel-cerrar:hover { background: var(--borde); }

        .cal-bloque { margin-bottom: 18px; }
        .cal-bloque h3 { font-size: 13px; margin: 0 0 8px 0; color: var(--texto); }

        .cal-colores { display: flex; flex-wrap: wrap; gap: 8px; }
        .cal-swatch {
            width: 30px; height: 30px;
            border: 2px solid var(--borde-2);
            border-radius: 8px;
            cursor: pointer;
            padding: 0;
        }
        .cal-swatch.activo { border-color: var(--texto); box-shadow: 0 0 0 2px var(--superficie) inset; }
        .cal-swatch-ninguno { background: var(--superficie); color: var(--texto-3); font-size: 13px; }

        .cal-vacio { font-size: 13px; color: var(--texto-2); margin: 0; }

        .cal-nota {
            border: 1px solid var(--borde);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }
        .cal-nota-titulo { font-weight: bold; font-size: 14px; }
        .cal-nota-situacion { font-size: 12px; color: var(--texto-2); margin-top: 4px; }
        .cal-nota-info { font-size: 12px; color: var(--texto-2); margin-top: 4px; white-space: pre-wrap; }
        .cal-nota-acciones { margin-top: 8px; display: flex; gap: 8px; }
        .cal-nota-acciones button {
            font-size: 12px;
            padding: 4px 10px;
            color: var(--texto);
            border: 1px solid var(--borde-2);
            background: var(--superficie);
            border-radius: 6px;
            cursor: pointer;
        }
        .cal-nota-acciones .cal-borrar { color: #d9534f; border-color: rgba(217, 83, 79, 0.4); }

        .cal-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: bold;
            padding: 1px 7px;
            border-radius: 999px;
            background: var(--superficie-2);
            color: var(--texto-2);
        }
        .cal-badge-pendiente { background: #fceccf; color: #8a5a00; }
        .cal-badge-en-curso { background: #cfe0f7; color: #1a4b86; }
        .cal-badge-hecho { background: #cfe9d6; color: #1a6b32; }
        .cal-badge-cancelada { background: #e0e0e0; color: #555; }

        /* ================= Formulario de nota ================= */
        .cal-form {
            border-top: 1px solid var(--borde);
            padding-top: 14px;
        }
        .cal-form h3 { font-size: 13px; margin: 0 0 10px 0; }
        .cal-campo { margin-bottom: 10px; }
        .cal-etiqueta { display: block; font-size: 12px; font-weight: bold; color: var(--texto); margin-bottom: 4px; }
        .cal-input, .cal-select {
            width: 100%;
            padding: 8px 10px;
            font-family: inherit;
            font-size: 13px;
            border: 1px solid var(--borde-2);
            border-radius: 7px;
            box-sizing: border-box;
        }
        textarea.cal-input { min-height: 70px; resize: vertical; }

        .cal-fila-situacion { display: flex; gap: 8px; margin-bottom: 10px; }
        .cal-fila-situacion .cal-select { flex: 0 0 130px; }
        .cal-fila-situacion .cal-input { flex: 1; }

        .cal-form-acciones { display: flex; gap: 8px; margin-top: 4px; }
        .cal-boton-principal {
            padding: 9px 18px;
            font-size: 13px;
            color: #fff;
            background: var(--color-primario);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .cal-boton-principal:hover { filter: brightness(0.92); }
        .cal-boton-secundario {
            padding: 9px 16px;
            font-size: 13px;
            color: var(--color-primario);
            background: var(--superficie);
            border: 1px solid var(--color-primario);
            border-radius: 8px;
            cursor: pointer;
        }

        /* ================= Pantalla de la bóveda ================= */
        #pantallaBoveda {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: var(--fondo);
            overflow-y: auto;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: max(40px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        }

        .vista-boveda {
            max-width: 560px;
            width: 100%;
            background: var(--superficie);
            border-radius: 14px;
            box-shadow: 0 4px 20px var(--sombra-2);
            padding: 28px 30px;
        }

        .vista-boveda h2 { font-size: 19px; margin: 0 0 10px 0; }
        .vista-boveda p { font-size: 13.5px; line-height: 1.55; color: var(--texto-2); }

        .cuadricula-palabras {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 16px 0;
        }
        .chip-palabra {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            background: var(--superficie-2);
            border: 1px solid var(--borde);
            border-radius: 8px;
            font-size: 14px;
        }
        .numero-palabra {
            font-size: 11px;
            color: var(--texto-3);
            min-width: 16px;
        }

        .confirmacion-anotado {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 13px;
            margin: 14px 0;
            line-height: 1.4;
        }

        .fila-campos-verificacion { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0; }
        .campo-verificacion { display: flex; flex-direction: column; gap: 4px; }
        .campo-verificacion label { font-size: 12px; font-weight: bold; }
        .campo-verificacion input {
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid var(--borde-2);
            border-radius: 7px;
        }

        .area-frase-desbloqueo {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 14px;
            border: 1px solid var(--borde-2);
            border-radius: 8px;
            margin: 10px 0;
        }

        .mensaje-error-boveda { color: #d9534f; font-size: 13px; font-weight: bold; min-height: 18px; }

        .boton-boveda-principal {
            padding: 10px 20px;
            font-size: 14px;
            color: #fff;
            background: var(--color-primario);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .boton-boveda-principal:disabled { opacity: 0.5; cursor: default; }
        .boton-boveda-secundario {
            padding: 10px 16px;
            font-size: 13px;
            color: var(--color-primario);
            background: var(--superficie);
            border: 1px solid var(--color-primario);
            border-radius: 8px;
            cursor: pointer;
        }
        .fila-botones-boveda { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }

        .salida-frase-perdida {
            margin-top: 22px;
            border-top: 1px solid var(--borde);
            padding-top: 14px;
        }
        .salida-frase-perdida summary { cursor: pointer; font-size: 13px; color: var(--color-primario); }
        .salida-frase-perdida p { font-size: 12.5px; }

        /* ================= Celular =================
           En pantalla chica NO se aplasta el mes para que quepa entero:
           la página hace scroll y cada día tiene alto suficiente para
           leerse. */
        @media (max-width: 700px) {
            html, body { height: auto; }

            #calendario {
                flex: 0 0 auto;
                min-height: 0;
                padding: 10px;
            }

            /* El título del mes en su propia línea (arriba); debajo, la
               fila de botones << < > >> y "Hoy". */
            .cal-encabezado { flex-wrap: wrap; gap: 6px; }
            .cal-titulo {
                flex: 1 1 100%;
                min-width: 0;
                order: -1;
                font-size: 18px;
            }
            .cal-nav { width: 44px; height: 40px; }

            .cal-dias-semana div { font-size: 11px; }

            /* Filas que crecen con el contenido en vez de repartirse la
               altura de la pantalla. */
            .cal-rejilla {
                flex: 0 0 auto;
                grid-auto-rows: minmax(76px, auto);
                gap: 3px;
            }
            .cal-celda { padding: 3px 4px; }
            .cal-numero { font-size: 12px; }
            .cal-chip-nota { font-size: 10.5px; }

            /* Panel del día: Situación en dos renglones (etiqueta y
               detalle) para que quepan. */
            .cal-panel-dia { padding: 20px 16px; }
            .cal-fila-situacion { flex-wrap: wrap; }
            .cal-fila-situacion .cal-select,
            .cal-fila-situacion .cal-input { flex: 1 1 100%; }

            .cal-nota-acciones button { padding: 7px 12px; }

            .vista-boveda { padding: 22px 18px; }
            .cuadricula-palabras { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        }
    </style>
</head>
<body>
    <header class="cal-barra">
        <a class="marca-mini" href="index.html" title="Volver al inicio">
            <img class="icono" src="imagenes/artonseley-pagina.png" alt="">
            <img class="letras" src="imagenes/artonseley-letras.png" alt="ARTONSELEY">
        </a>
        <a class="enlace-inicio" href="index.html">← Inicio</a>
    </header>

    <main id="calendario"></main>

    <!-- Tapa todo hasta que la bóveda del calendario queda desbloqueada. -->
    <div id="pantallaBoveda">
        <div id="vistaBovedaCargando" class="vista-boveda">
            <h2>Abriendo tu calendario…</h2>
            <p>Un momento.</p>
        </div>

        <div id="vistaBovedaIncognito" class="vista-boveda" hidden>
            <h2>Estás en una ventana privada / incógnito</h2>
            <p>En modo incógnito el navegador borra todo al cerrar la ventana, así que las notas del calendario no se podrían guardar de forma segura. Abre Artonseley en una ventana normal para usar el calendario.</p>
        </div>

        <div id="vistaBovedaConfiguracion" class="vista-boveda" hidden></div>
        <div id="vistaBovedaVerificacion" class="vista-boveda" hidden></div>
        <div id="vistaBovedaDesbloqueo" class="vista-boveda" hidden></div>
    </div>

    <script type="module" src="Sistema/reproductorGlobal.js"></script>
    <script type="module" src="Sistema/calendarioPrincipal.js"></script>
</body>
</html>
